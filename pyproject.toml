[project]
name = "evaluation_dedoublement_cp_ce1_education_prioritaire"
version = "0.1.0"
description = "Projet statistique et data science pour l'analyse du dédoublement des classes en éducation prioritaire"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.5.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.8.0",
    "plotly>=5.24.0",
    "jupyterlab>=4.3.0",
    "notebook>=7.3.0",
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "streamlit>=1.38.0",
    "seaborn>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
